spring:
  datasource:
    url: jdbc:h2:mem:hmslocal;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false
  cache:
    type: simple
  kafka:
    enabled: false
    listener:
      auto-startup: false

app:
  kafka:
    enabled: false
